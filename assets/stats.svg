<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 540" width="590" height="540" role="img" aria-label="Player stats: waiting for the first sync"><title>Player stats: waiting for the first sync</title><style>@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 1.2s steps(2) infinite}@keyframes wob{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}.wob{animation:wob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="8.0" y="8.0" width="580.0" height="530.0" fill="#111111"/><rect x="3.5" y="3.5" width="577.0" height="527.0" fill="#FFF4E0" stroke="#111111" stroke-width="3"/><text x="295.0" y="280.0" font-family="'Arial Black','Archivo Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="#111111" text-anchor="middle" letter-spacing="-0.5">LOADING...</text><text x="295.0" y="316.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#4A4A4A" text-anchor="middle">Player stats appears after the next GitHub Actions run</text><g class="bob"><image href="data:image/png;base64," x="263.0" y="170.0" width="64" height="64" style="image-rendering:pixelated" preserveAspectRatio="none"/></g></svg>
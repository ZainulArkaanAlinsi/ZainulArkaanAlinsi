<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 128" width="1200" height="128" role="img" aria-label="Developer news, refreshed automatically"><title>Developer news, refreshed automatically</title><style>@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 1.2s steps(2) infinite}@keyframes wob{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}.wob{animation:wob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="8.0" y="8.0" width="1190.0" height="118.0" fill="#111111"/><rect x="3.5" y="3.5" width="1187.0" height="115.0" fill="#5AA9FF" stroke="#111111" stroke-width="3"/><text x="40.0" y="82.0" font-family="'Arial Black','Archivo Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="56" font-weight="900" fill="#111111" text-anchor="start" letter-spacing="-0.5">DEV NEWS</text><text x="372.0" y="64.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#111111" text-anchor="start">fresh stories from the source feeds</text><text x="372.0" y="92.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111111" text-anchor="start">refreshed automatically</text><g transform="translate(1050.0,60.0) rotate(5)"><g class="wob"><rect x="-93.2" y="-12.5" width="194.3" height="33.0" fill="#111111"/><rect x="-95.7" y="-15.0" width="191.3" height="30.0" fill="#FFD23F" stroke="#111111" stroke-width="3"/><text x="0.0" y="5.4" font-family="'Arial Black','Archivo Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="900" fill="#111111" text-anchor="middle">HOT OFF THE PRESS</text></g></g></svg>
name: snake

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Colours are the profile palette: one green, stepped toward each canvas.
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1F9E63&color_dots=#EAEDF1,#BCE2D0,#7EC7A5,#4DB283,#1F9E63
            dist/github-snake-dark.svg?color_snake=#5BC98D&color_dots=#191C21,#224331,#397855,#4AA272,#5BC98D

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: snake

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Colours are the profile palette: terracotta snake, sage dots stepped from navy.
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E07A5F&color_dots=#E8DCC4,#C9D3BF,#B8C6AC,#A7B89A,#7F9470
            dist/github-snake-dark.svg?color_snake=#E07A5F&color_dots=#1B2B3C,#3F5148,#5E7360,#829679,#A7B89A

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

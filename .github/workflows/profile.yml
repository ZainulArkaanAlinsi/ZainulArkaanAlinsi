name: profile

on:
  schedule:
    - cron: "17 */6 * * *" # every six hours, off the hour so it is not queued with everyone else
  workflow_dispatch:
  push:
    branches: [main]
    # Never re-trigger on the commit this workflow makes itself.
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  # A cancelled run can drop its commit on the floor, which is exactly how the
  # README ends up showing data older than the repo. Let runs queue instead.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build assets and re-stamp the README
        run: python scripts/build.py
        env:
          # A PAT with read:user also counts private contributions; the built-in
          # token is enough for the public ones.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "chore: refresh profile assets"
          for delay in 0 2 4 8 16; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push rejected; will fetch and retry"
          done
          echo "could not push after 5 attempts" >&2
          exit 1

name: profile

on:
  # Every push to main refreshes the page, so a new commit shows up in the
  # commit log and the voxel world right away. The bot's own commit is pushed
  # with GITHUB_TOKEN, which never triggers another run, so this cannot loop.
  push:
    branches: [main]
  # Pushes to your other repos are picked up on the hourly run (off the hour so
  # it is not queued behind everyone else's :00 jobs) ...
  schedule:
    - cron: "17 * * * *"
  # ... or instantly, if another repo sends a repository_dispatch (see docs/refresh-from-other-repos.md).
  repository_dispatch:
    types: [profile-refresh]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  # A cancelled run can drop its commit on the floor, which is exactly how the
  # README ends up showing data older than the repo. Let runs queue instead.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: pip install pillow==12.3.0 numpy==2.5.3

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build assets and re-stamp the README
        run: python scripts/build.py
        env:
          # A PAT with read:user also counts private contributions; the built-in
          # token is enough for the public ones.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "chore: refresh profile assets"
          for delay in 0 2 4 8 16; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push rejected; will fetch and retry"
          done
          echo "could not push after 5 attempts" >&2
          exit 1
